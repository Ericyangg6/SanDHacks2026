<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shade - County operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@200;300;400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root {
  --ink: #0b2540;            /* text on glass */
  --ink-2: #3f5872;          /* secondary text, tinted toward the water blue */
  --line: rgba(11, 60, 110, .13);
  --blue: #0369a1;           /* actions, selection */
  --heat: #f4a765;           /* a person requesting help; the only warm color */
  --heat-ink: #2a1806;
  --cool: #7fe3f2;           /* help incoming */
  --zone: #0b74c9;           /* cool zone token */
  --paper: #eaf5fd;
  --forest: #0b2540;
  --aqi-good: #a5d68f; --aqi-mod: #ecd670; --aqi-usg: #f4a765; --aqi-bad: #ee7a66;
  --r: 24px;
  --ease: cubic-bezier(.16, 1, .3, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: 400 14px/1.45 "Hanken Grotesk", system-ui, sans-serif;
  color: var(--ink); background: var(--paper);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--blue); color: #fff; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: "Red Hat Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .01em; }

/* ---------- map: paper cartography ---------- */
#map { position: fixed; inset: 0; background: var(--paper); z-index: 0; }
.leaflet-tile-pane { filter: grayscale(1) sepia(1) hue-rotate(165deg) saturate(1.5) brightness(1.06) contrast(.92); }
#map::after {   /* fine survey grid over the paper */
  content: ""; position: absolute; inset: 0; z-index: 450; pointer-events: none;
  background-image: linear-gradient(rgba(3, 105, 161, .1) 1px, transparent 1px), linear-gradient(90deg, rgba(3, 105, 161, .1) 1px, transparent 1px);
  background-size: 84px 84px;
}
.leaflet-container { font: inherit; }
.leaflet-control-attribution { background: rgba(255, 255, 255, .7) !important; color: var(--ink-2); font-size: 10px; border-radius: 8px 0 0 0; }
.leaflet-control-attribution a { color: var(--blue); }
.leaflet-bottom.leaflet-right { right: 396px; bottom: 12px; }
.leaflet-bar { border: 0 !important; box-shadow: 0 8px 18px -8px rgba(11, 60, 110, .35) !important; border-radius: 14px !important; overflow: hidden; }
.leaflet-bar a { background: rgba(255, 255, 255, .85) !important; color: var(--blue) !important; border-color: rgba(11, 60, 110, .15) !important; width: 36px !important; height: 36px !important; line-height: 36px !important; }
.leaflet-bar a:hover { background: #fff !important; }

/* tokens */
.tk { display: grid; place-items: center; border-radius: 50%; transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
.tk svg { width: 58%; height: 58%; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.zone { width: 34px; height: 34px; background: var(--zone); color: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .9), 0 6px 12px -4px rgba(11, 50, 100, .45); }
.zone.discovered { background: #fff; color: var(--zone); box-shadow: 0 0 0 1.5px var(--zone), 0 0 0 4px rgba(255, 255, 255, .9), 0 6px 12px -4px rgba(11, 50, 100, .45); }
.zone.closed { background: #c9d6e2; color: #7a8ea3; box-shadow: 0 0 0 3px rgba(255, 255, 255, .7); }
.zone.sel, .req.sel { transform: scale(1.3); }
.req { width: 30px; height: 30px; position: relative; color: var(--heat-ink); background: var(--heat); box-shadow: 0 0 0 3px #fff, 0 8px 14px -4px rgba(11, 50, 100, .45); font: 600 13px/1 "Hanken Grotesk", sans-serif; }
.req.incoming { background: var(--cool); color: #0c2a33; box-shadow: 0 0 0 3px #f2fbfd, 0 8px 14px -4px rgba(11, 50, 100, .45); }
.req.requesting::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 2px solid var(--heat); animation: ping 1.8s var(--ease) infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--forest); box-shadow: 0 0 0 2px rgba(255, 255, 255, .9); opacity: .7; }
@media (prefers-reduced-motion: reduce) { .req.requesting::after { animation: none; } * { transition: none !important; } }

/* ---------- glass ---------- */
.glass {   /* liquid glass: clear, bright-edged, bends the map beneath it */
  position: relative; isolation: isolate;
  background: linear-gradient(160deg, rgba(255, 255, 255, .62), rgba(226, 242, 253, .38) 45%, rgba(255, 255, 255, .5));
  -webkit-backdrop-filter: blur(22px) saturate(190%) brightness(1.06);
  backdrop-filter: blur(22px) saturate(190%) brightness(1.06);
  backdrop-filter: url(#liquid) blur(14px) saturate(190%) brightness(1.06);   /* Chromium: adds refraction */
  border: 1px solid rgba(255, 255, 255, .7);
  box-shadow: 0 24px 48px -20px rgba(11, 60, 110, .45), 0 2px 6px -2px rgba(11, 60, 110, .2),
    inset 0 1.5px 0 rgba(255, 255, 255, .95), inset 0 -1px 0 rgba(255, 255, 255, .45), inset 1px 0 0 rgba(255, 255, 255, .5), inset 0 0 28px rgba(255, 255, 255, .35);
  border-radius: var(--r);
}
.glass::before {   /* specular sweep from the top-left, cool caustic at the bottom-right */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(120% 60% at 0% 0%, rgba(255, 255, 255, .7), transparent 60%), radial-gradient(90% 50% at 100% 100%, rgba(125, 211, 252, .28), transparent 65%);
}
@media (prefers-reduced-transparency: reduce) {
  .glass { background: #f4faff; -webkit-backdrop-filter: none; backdrop-filter: none; }
}
.top { position: fixed; z-index: 500; top: 16px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
.top > * { pointer-events: auto; }
.pill { height: 52px; padding: 0 18px; display: flex; align-items: center; gap: 12px; border-radius: 26px; white-space: nowrap; }
.brand { padding-left: 9px; }
.brand .tk { width: 34px; height: 34px; background: var(--zone); color: #fff; }
.brand b { font-weight: 500; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--ink-2); }
.alert i { width: 8px; height: 8px; border-radius: 50%; background: var(--heat); }
.alert b { font-weight: 500; }
.alert span { color: var(--ink-2); }
.spacer { flex: 1; }
.tag { border: 1px dashed rgba(11, 60, 110, .45); border-radius: 999px; padding: 3px 10px; color: var(--ink-2); }
.head .tag { font-weight: 400; letter-spacing: .01em; vertical-align: 3px; margin-left: 6px; }
.btn { height: 36px; padding: 0 16px; border-radius: 18px; background: var(--blue); color: #fff; font-weight: 500; transition: background .2s, transform .2s var(--ease); }
.btn:hover { background: #075985; }
.btn:active { transform: scale(.97); }
.btn:disabled { background: rgba(11, 60, 110, .12); color: var(--ink-2); cursor: default; }

.panel { position: fixed; z-index: 500; top: 84px; bottom: 16px; display: flex; flex-direction: column; overflow: hidden; }
#zones { left: 16px; width: 340px; }
#side { right: 16px; width: 368px; }
.head { padding: 20px 22px 14px; }
.head h2 { font-size: 20px; font-weight: 300; letter-spacing: -.01em; }
.head p { color: var(--ink-2); margin-top: 2px; }
.scroll { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: rgba(11, 60, 110, .25) transparent; }
.rule { border-top: 1px solid var(--line); }

/* zone rows */
.zrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; width: 100%; padding: 13px 22px; border-top: 1px solid var(--line); transition: background .2s; }
.zrow:hover, .zrow.sel { background: rgba(255, 255, 255, .4); }
.zrow h3 { font-size: 14.5px; font-weight: 500; }
.zrow .sub { color: var(--ink-2); font-size: 13px; }
.zrow .closes { text-align: right; white-space: nowrap; }
.zrow .closes small { display: block; color: var(--ink-2); font-size: 12px; }
.load { grid-column: 1 / -1; display: flex; align-items: center; color: var(--ink-2); font-size: 12.5px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.load .refs b { color: var(--ink); font-weight: 600; }
.load .ver::before { content: "\00b7"; margin: 0 8px; }
.load .air { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: 'Red Hat Mono', ui-monospace, monospace; font-size: 11.5px; letter-spacing: .04em; }
.zrow.closed h3, .zrow.closed .closes { color: var(--ink-2); }
.ztag { display: inline-block; margin-right: 7px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; line-height: 18px; vertical-align: 1px; white-space: nowrap; }
.ztag.cz { background: var(--zone); color: #fff; }
.ztag.ps { background: #fff; color: var(--zone); box-shadow: inset 0 0 0 1.5px var(--zone); }
.zrow.closed .ztag.cz { background: #c9d6e2; color: var(--ink); }
.zrow.closed .ztag.ps { color: var(--ink-2); box-shadow: inset 0 0 0 1.5px #9fb3c6; }
.aqi { display: inline-block; min-width: 34px; text-align: center; padding: 1px 7px; border-radius: 999px; color: #1b2014; font-weight: 500; font-size: 12.5px; }
.legend { padding: 12px 22px 16px; display: grid; grid-template-columns: 14px 1fr; gap: 7px 10px; align-items: center; color: var(--ink-2); font-size: 12.5px; }
.legend p { grid-column: 1 / -1; margin: 0 0 2px; color: var(--ink); font-weight: 500; font-size: 13px; }
.legend p svg { width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; fill: none; stroke: var(--blue); stroke-width: 2.2; }
.legend .tk { width: 14px; height: 14px; box-shadow: none; }
.legend .tk::after { display: none; }
.legend .dot { justify-self: center; }

/* readings */
.now { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 22px 4px; }
.now b { display: block; font-size: 46px; font-weight: 200; letter-spacing: -.03em; line-height: 1.05; }
.now span { color: var(--ink-2); font-size: 13px; }
.note { padding: 8px 22px 14px; color: var(--ink-2); font-size: 13px; }
.note em { font-style: normal; color: var(--ink); }
.rrow { display: grid; grid-template-columns: 1fr 44px 44px 48px; gap: 8px; align-items: center; width: 100%; padding: 7px 22px; transition: background .2s; }
.rrow:hover, .rrow[aria-pressed=true] { background: rgba(255, 255, 255, .4); }
.rrow[aria-pressed=true] .area { font-weight: 500; }
.rrow .n, .rhead span + span { text-align: right; }
.rhead { color: var(--ink-2); font-size: 12px; padding-bottom: 4px; }
.rrow .area small { color: var(--ink-2); margin-left: 6px; }

/* requests */
.req-row { border-top: 1px solid var(--line); padding: 14px 22px; transition: background .2s; }
.req-row.sel { background: rgba(255, 255, 255, .4); }
.req-row.new { animation: arrive 1.2s var(--ease); }
@keyframes arrive { from { background: rgba(244, 167, 101, .4); } }
.req-row .open { display: block; width: 100%; }
.req-row h3 { font-size: 14.5px; font-weight: 500; }
.req-row .meta { color: var(--ink-2); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0 11px; }
.chip { padding: 2px 10px; border-radius: 999px; background: rgba(255, 255, 255, .6); font-size: 13px; }
.said { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .55); font-size: 13.5px; }
.more { display: none; }
.req-row.sel .more { display: block; }
.agent { display: flex; align-items: center; gap: 9px; color: var(--ink-2); font-size: 13px; }
.req-row.sel .agent { margin-bottom: 12px; }
.st { flex: none; padding: 1px 9px; border-radius: 999px; font: 500 11px/18px "Red Hat Mono", ui-monospace, monospace; letter-spacing: .04em; text-transform: uppercase; }
.st.requesting { background: var(--heat); color: var(--heat-ink); }
.st.incoming { background: var(--cool); color: #0c2a33; }

/* small screens: map on top, panels stacked below */
@media (max-width: 1000px) {
  body { overflow-y: auto; }
  #map { position: relative; inset: auto; height: 58vh; }
  .top { position: absolute; flex-wrap: wrap; }
  .top .alert span, .top .brand span, .top .tag, .spacer { display: none; }
  .panel { position: static; width: auto !important; margin: 12px; max-height: none; }
  .scroll { overflow: visible; }
  .leaflet-bottom.leaflet-right { right: 0; }
  body { background: #d6eaf8; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="n"/>
  <feGaussianBlur in="n" stdDeviation="2" result="s"/>
  <feDisplacementMap in="SourceGraphic" in2="s" scale="60" xChannelSelector="R" yChannelSelector="G"/>
</filter></svg>
<div id="map" aria-label="Map of San Diego County cool zones and help requests"></div>

<header class="top">
  <div class="glass pill brand">
    <div class="tk"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg></div>
    <b>Shade</b><span>County operations</span>
  </div>
  <div class="glass pill alert" role="status" id="alert" hidden>
    <i></i><b id="alertk"></b><span id="alertw"></span>
  </div>
  <div class="spacer"></div>
  <div class="glass pill">
    <span class="tag mono" id="src">Loading</span>
    <span class="mono" id="clock"></span>
  </div>
</header>

<section class="glass panel" id="zones" aria-labelledby="zh">
  <div class="head">
    <h2 id="zh">Cool zones</h2>
    <p id="zsum"></p>
  </div>
  <div class="scroll" id="zlist"></div>
  <div class="legend rule">
    <p><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Caller markers on the map</p>
    <i class="tk req"></i><span>Waiting for a dispatcher</span>
    <i class="tk req incoming"></i><span>Help confirmed by a dispatcher</span>
    <i class="dot"></i><span>Called or texted in the last 24h</span>
  </div>
</section>

<aside class="glass panel" id="side">
  <section class="scroll" aria-labelledby="qh">
    <div class="head">
      <h2 id="qh">Help requests</h2>
      <p id="qsum" role="status"></p>
    </div>
    <div id="qlist"></div>
  </section>
  <section class="rule" aria-labelledby="rh" style="padding-bottom:10px">
    <div class="head">
      <h2 id="rh">Readings</h2>
      <p id="rwhere"></p>
    </div>
    <div class="now" id="rnow"></div>
    <p class="note" id="rnote"></p>
    <div class="rrow rhead"><span>Area</span><span>Temp</span><span>Feels</span><span>AQI</span></div>
    <div id="rlist"></div>
  </section>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const API = qs.get('api') || 'http://localhost:4111';   // ?api=https://xxxx.ngrok-free.app
const NOW = qs.get('now');                               // ?now=2026-11-16T11:00:00-08:00 replays a moment for demos
const POLL_MS = 10000;
const AST = '<svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/></svg>';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);   // site data is scraped: never trust it as HTML
const KIND = { cool_zone: 'Cool zone', library: 'Library', rec_center: 'Rec center', community_center: 'Community center', senior_center: 'Senior center', mall: 'Mall', other: 'Public space' };
const ALERT = { extreme_heat_warning: 'Extreme Heat Warning', heat_advisory: 'Heat Advisory', air_quality_alert: 'Air Quality Alert', mock: 'Mock heat alert' };
const SOURCE = { nws: 'NWS', airnow: 'AirNow', purpleair: 'PurpleAir', mock: 'Mock' };
const LA = { timeZone: 'America/Los_Angeles' };
const to12h = hm => { const [h, m] = hm.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2, '0')} ${h % 24 < 12 ? 'AM' : 'PM'}`; };
const clockAt = iso => new Date(iso).toLocaleTimeString('en-US', { ...LA, hour: 'numeric', minute: '2-digit' });
const deg = v => v == null ? '–' : `${Math.round(v)}°`;
const aqiBand = a => a == null ? ['No AQI reading', 'rgba(11, 60, 110, .1)'] : a <= 50 ? ['Good', 'var(--aqi-good)'] : a <= 100 ? ['Moderate', 'var(--aqi-mod)']
  : a <= 150 ? ['Unhealthy for sensitive groups', 'var(--aqi-usg)'] : ['Unhealthy', 'var(--aqi-bad)'];
const aqiChip = a => `<span class="aqi" style="background:${aqiBand(a)[1]}" title="${aqiBand(a)[0]}">${a ?? '–'}</span>`;

const state = { data: null, key: '', zip: null, req: null, zone: null, live: [], rkey: null };
const sites = () => state.data?.sites ?? [];
const siteById = id => sites().find(z => z.id === id);
const readingFor = zip => state.data?.readings.find(r => r.zip === zip);

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: false }).setView([32.79, -117.04], 11);
L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: 'USGS The National Map',
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);
const wide = () => innerWidth > 1000;
const pad = () => wide() ? { paddingTopLeft: [380, 100], paddingBottomRight: [410, 40] } : { padding: [30, 30] };

const icon = (html, size) => L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
const zoneIcon = z => icon(`<div class="tk zone ${z.tier} ${z.open_now ? '' : 'closed'} ${state.zone === z.id ? 'sel' : ''}">${AST}</div>`, 34);
const reqIcon = r => icon(`<div class="tk req ${r.status === 'incoming' ? 'incoming' : 'requesting'} ${state.req === r.id ? 'sel' : ''}"></div>`, 30);

const callLayer = L.layerGroup().addTo(map), zoneLayer = L.layerGroup().addTo(map), reqLayer = L.layerGroup().addTo(map);
const zoneMarkers = {}, reqMarkers = {};
function syncReqMarkers() {   // a request whose location couldn't be placed has a card but no marker
  reqLayer.clearLayers();
  for (const id in reqMarkers) delete reqMarkers[id];
  for (const r of state.live) if (r.lat != null) {
    reqMarkers[r.id] = L.marker([r.lat, r.lon], { icon: reqIcon(r), title: r.location, zIndexOffset: 500 }).addTo(reqLayer).on('click', () => pickReq(r.id));
  }
}

function syncMap() {
  const seen = new Set();
  for (const z of sites()) {
    seen.add(z.id);
    zoneMarkers[z.id] ??= L.marker([z.lat, z.lon], { title: z.name }).addTo(zoneLayer).on('click', () => pickZone(z.id));
  }
  for (const id in zoneMarkers) if (!seen.has(+id)) { zoneLayer.removeLayer(zoneMarkers[id]); delete zoneMarkers[id]; }
  callLayer.clearLayers();
  state.data.calls.forEach(c => L.marker([c.lat, c.lon], { icon: icon('<div class="dot"></div>', 9), interactive: false, keyboard: false }).addTo(callLayer));
  refreshIcons();
}
function refreshIcons() {
  sites().forEach(z => zoneMarkers[z.id]?.setIcon(zoneIcon(z)));
  state.live.forEach(r => reqMarkers[r.id]?.setIcon(reqIcon(r)));
}

/* ---------- top bar ---------- */
function renderTop() {
  const d = state.data, a = d.alerts[0];
  $('alert').hidden = !a;
  if (a) {
    $('alertk').textContent = ALERT[a.kind] + (d.alerts.length > 1 ? ` +${d.alerts.length - 1} more` : '');
    $('alertw').textContent = [`${a.zips.length} zip${a.zips.length === 1 ? '' : 's'}`, a.expires_at && `until ${clockAt(a.expires_at)}`].filter(Boolean).join(', ');
  }
  $('src').textContent = d.source === 'neon' ? 'Live data' : 'Seed data';
  $('src').title = d.source === 'neon' ? 'Neon database' : 'Snapshot from data/seed/, no live calls or alerts';
}

/* ---------- cool zones ---------- */
function verified(z) {
  if (z.stale) return 'Not verified in 24h';
  const d = new Date(z.last_verified_at), today = new Date().toLocaleDateString('en-US', LA);
  return d.toLocaleDateString('en-US', LA) === today ? 'Verified today' : `Verified ${d.toLocaleDateString('en-US', { ...LA, month: 'short', day: 'numeric' })}`;
}
function renderZones() {
  const all = sites(), open = all.filter(z => z.open_now);
  $('zsum').textContent = `${open.length} open now, ${all.length - open.length} closed`;
  const official = z => z.tier === 'official';
  const rows = [...all].sort((a, b) => b.open_now - a.open_now || official(b) - official(a) || b.referrals_24h - a.referrals_24h || a.name.localeCompare(b.name));
  $('zlist').innerHTML = rows.map(z => {
    const tag = official(z) ? '<span class="ztag cz">Cool Zone</span>' : '<span class="ztag ps">Public Space</span>';
    const sure = z.confidence != null ? `, ${Math.round(z.confidence * 100)}% sure of hours` : '';
    const sub = official(z) ? KIND[z.kind] : `${KIND[z.kind]} · Call ahead${sure}`;
    const cap = z.capacity_est ? `/${z.capacity_est}` : '';
    return `<button class="zrow ${z.open_now ? '' : 'closed'} ${state.zone === z.id ? 'sel' : ''}" data-z="${z.id}" title="${esc(z.address)}. Today: ${esc(z.hours_today)}">
      <span><h3>${esc(z.name)}</h3><span class="sub">${tag}${esc(sub)}</span></span>
      <span class="closes">${z.open_now ? `${to12h(z.closes_at)}<small>closes</small>` : 'Closed now'}</span>
      ${z.open_now ? `<span class="load"><span class="refs" title="Sent by Shade in the last 24h / estimated capacity"><b>${z.referrals_24h}</b>${cap} sent</span><span class="ver">${verified(z)}</span><span class="air">AQI ${aqiChip(readingFor(z.zip)?.aqi)}</span></span>` : ''}
    </button>`;
  }).join('');
}
$('zlist').onclick = e => { const b = e.target.closest('[data-z]'); if (b) pickZone(+b.dataset.z); };

function pickZone(id) {
  state.zone = id; state.req = null;
  const z = siteById(id);
  map.flyTo([z.lat, z.lon], 14, { duration: .8 });
  if (z.zip && readingFor(z.zip)) state.zip = z.zip;
  renderZones(); renderReqs(); renderReadings(); refreshIcons();
}

/* ---------- readings ---------- */
function renderReadings() {
  const heat = r => r.heat_index ?? r.temp_f ?? -Infinity;
  const all = [...state.data.readings].sort((a, b) => heat(b) - heat(a));
  if (!all.length) {
    $('rwhere').textContent = 'No readings yet'; $('rnow').innerHTML = ''; $('rnote').textContent = ''; $('rlist').innerHTML = '';
    return;
  }
  if (!readingFor(state.zip)) state.zip = all[0].zip;   // default to the hottest zip
  const r = readingFor(state.zip);
  $('rwhere').textContent = r.area === r.zip ? r.zip : `${r.area} ${r.zip}`;
  $('rnow').innerHTML = `<div><b>${deg(r.temp_f)}</b><span>Temperature</span></div>
    <div><b>${deg(r.heat_index)}</b><span>Feels like</span></div><div><b>${r.aqi ?? '–'}</b><span>AQI</span></div>`;
  const future = new Date(r.time) > new Date(state.data.generated_at);
  const when = new Date(r.time).toLocaleString('en-US', { ...LA, weekday: 'short', hour: 'numeric', minute: '2-digit' });
  $('rnote').innerHTML = `${r.aqi != null ? `<em>${aqiBand(r.aqi)[0]}</em> air. ` : ''}${SOURCE[r.source]} ${future ? 'forecast for' : 'reading at'} ${when}.`;
  const shown = all.slice(0, 6);
  if (!shown.includes(r)) shown.push(r);
  $('rlist').innerHTML = shown.map(x => `<button class="rrow" aria-pressed="${x.zip === state.zip}" data-zip="${esc(x.zip)}">
    <span class="area">${esc(x.area === x.zip ? '' : x.area)}<small class="mono">${esc(x.zip)}</small></span>
    <span class="n">${deg(x.temp_f)}</span><span class="n">${deg(x.heat_index)}</span><span class="n">${aqiChip(x.aqi)}</span></button>`).join('');
}
$('rlist').onclick = e => { const b = e.target.closest('[data-zip]'); if (b) { state.zip = b.dataset.zip; renderReadings(); } };

/* ---------- help requests (GET /dispatch/requests) ---------- */
const LANG = { en: 'English', es: 'Spanish', tl: 'Tagalog', vi: 'Vietnamese', zh: 'Chinese' };
function renderReqs(fresh) {
  const n = s => state.live.filter(r => r.status === s).length;
  $('qsum').textContent = `${n('requesting')} requesting, ${n('incoming')} incoming`;
  $('qlist').innerHTML = [...state.live].sort((a, b) => (a.status === 'incoming') - (b.status === 'incoming')).map(r => {
    const want = r.status === 'requesting';
    const meta = [readingFor(r.zip)?.area ?? r.zip, `Call${LANG[r.language] ? `, ${LANG[r.language]}` : ''}`, clockAt(r.created_at)].filter(Boolean).join(' · ');
    return `<article class="req-row ${state.req === r.id ? 'sel' : ''} ${fresh === r.id ? 'new' : ''}" data-q="${r.id}">
      <button class="open" aria-expanded="${state.req === r.id}">
        <h3>${esc(r.location)}</h3>
        <span class="meta">${esc(meta)}</span>
      </button>
      <div class="chips">${r.needs.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>
      <div class="agent"><span class="st ${want ? 'requesting' : 'incoming'}">${want ? 'Requesting' : 'Incoming'}</span><span>${want ? 'Waiting for a dispatcher' : 'Help confirmed'}</span></div>
      <div class="more"><p class="said">“${esc(r.said)}”</p></div>
    </article>`;
  }).join('');
}
$('qlist').onclick = e => {
  const row = e.target.closest('[data-q]'); if (!row) return;
  if (e.target.closest('.open')) pickReq(+row.dataset.q);
};

function pickReq(id) {
  state.req = state.req === id ? null : id; state.zone = null;
  const r = state.live.find(x => x.id === state.req);
  if (r?.lat != null) map.flyTo([r.lat, r.lon], 14, { duration: .8 });
  if (state.data) renderZones();
  renderReqs(); refreshIcons();
}

async function loadReqs() {
  try {
    const res = await fetch(`${API}/dispatch/requests`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = (await res.json()).requests, key = JSON.stringify(rows);
    if (key === state.rkey) return;   // re-render only on change, so focus and scroll survive the poll
    const fresh = state.rkey != null && rows.find(r => !state.live.some(x => x.id === r.id))?.id;
    state.rkey = key; state.live = rows;
    if (!rows.some(r => r.id === state.req)) state.req = null;
    syncReqMarkers(); renderReqs(fresh);
  } catch (err) {
    $('qsum').textContent = `Can't load help requests (${err.message})`;
  }
}
/* ---------- data ---------- */
async function load() {
  try {
    const res = await fetch(`${API}/dashboard/state${NOW ? `?now=${encodeURIComponent(NOW)}` : ''}`, { cache: 'no-store' });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`);
    const d = await res.json();
    const key = JSON.stringify({ ...d, generated_at: 0 });
    const first = !state.data;
    state.data = d;
    if (key !== state.key) {   // re-render only on change, so focus and scroll survive the poll
      state.key = key;
      renderTop(); renderZones(); renderReadings(); syncMap();
    }
    if (first && d.sites.length) map.fitBounds(L.latLngBounds(d.sites.map(z => [z.lat, z.lon])), pad());
  } catch (err) {
    $('src').textContent = 'API offline';
    $('src').title = `${API}: ${err.message}`;
    if (!state.data) $('zsum').textContent = `Can't reach the Shade API at ${API}`;
  }
}

const tick = () => $('clock').textContent = new Date().toLocaleTimeString('en-US', { ...LA, hour: 'numeric', minute: '2-digit' });
tick(); setInterval(tick, 15000);
load(); setInterval(load, POLL_MS);
loadReqs(); setInterval(loadReqs, POLL_MS);
</script>
</body>
</html>
